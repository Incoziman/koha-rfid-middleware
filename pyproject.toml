[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "koha-rfid-middleware"
version = "0.2.0"
description = "UHF RFID for Koha: desk agent for the staff plugin, labels, SIP2 self-check"
readme = "README.md"
requires-python = ">=3.8"

[project.optional-dependencies]
# The R220 over LLRP. Pinned: the version step 1 was tested with.
reader = ["sllurp==2.0.1"]

[project.scripts]
koha-rfid-agent = "koha_rfid.agent.__main__:main"
koha-rfid-labels = "koha_rfid.labels:main"

[tool.setuptools.packages.find]
include = ["koha_rfid*"]
