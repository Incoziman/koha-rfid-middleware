[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "koha-rfid-middleware"
version = "0.5.0"
description = "UHF RFID for Koha: desk agent for the staff plugin, labels, SIP2 self-check, stocktake"
readme = "README.md"
requires-python = ">=3.8"

[project.optional-dependencies]
# The Impinj R220 over LLRP (desk test reader, stocktake). Pinned: the version
# step 1 was tested with. The Chafon CF606 (not confirmed, no driver yet) will
# get its own extra (pyserial) once its driver exists.
r220 = ["sllurp==2.0.1"]

[project.scripts]
koha-rfid-agent = "koha_rfid.agent.__main__:main"
koha-rfid-labels = "koha_rfid.labels:main"
koha-rfid-stocktake = "koha_rfid.stocktake.__main__:main"

[tool.setuptools.packages.find]
include = ["koha_rfid*"]
