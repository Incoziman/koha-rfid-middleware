; Koha RFID desk agent settings. install_agent.ps1 copies this to
; C:\koha-rfid\agent.ini on first install.
; The [reader] and [printer] settings can be changed from Koha, on the desk PC
; itself: Manage plugins > RFID desk > Configure > "This desk PC". They are
; saved here and applied at once. Anything else: edit this file, then restart:
;   powershell -ExecutionPolicy Bypass -File C:\koha-rfid\install_agent.ps1 -Restart

[agent]
; Port on 127.0.0.1 the Koha plugin talks to (must match the plugin setting).
listen_port = 8765
; Koha staff interface address(es), exactly as in the browser's address bar
; (scheme://host:port, no path). Other web pages are refused.
allowed_origins = http://debian.mshome.net:8082
; Relative to this file.
log_file = agent.log

[reader]
; Impinj R220 (LLRP). Leave host empty if this desk has no reader.
host = 192.168.1.3
antennas = 1
; Index into the R220 power table: 0 = max (32.5 dBm), else 10 + (index-1) x 0.25 dBm.
; Set the pad power found in the field test (docs/testing/field-test.md, section 3).
power = 0
; Seconds a tag stays "on the pad" after its last read.
pad_seconds = 2.0
; Seconds between reconnect attempts when the reader is off or unplugged.
retry_seconds = 10
; Testing without a reader: pretend these EPCs are on the pad (comma-separated).
; fake_epcs = 0E3322801679489100000000, 0D3322830031985000000000

[printer]
; Zebra ZD500R on the network (raw port 9100). Leave host empty if this desk
; doesn't print RFID labels.
host =
port = 9100
